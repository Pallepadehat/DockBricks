name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-tauri:
    runs-on: macos-latest

    env:
      RELEASE_ARGS: "--bundles dmg,app"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            mkdir -p "$RUNNER_TEMP/apple-notarization"
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple-notarization/AuthKey.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple-notarization/AuthKey.p8" >> "$GITHUB_ENV"
          fi

      - name: Verify macOS signing and notarization secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY KEYCHAIN_PASSWORD APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8 APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for signed and notarized macOS releases."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit "$missing"
          fi

          cert_path="$RUNNER_TEMP/apple-certificate.p12"
          if ! printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$cert_path" 2>/dev/null; then
            echo "::error::APPLE_CERTIFICATE must be the base64-encoded contents of an exported .p12 certificate. Do not include quotes or the file path."
            exit 1
          fi

          if ! openssl pkcs12 -in "$cert_path" -noout -passin "pass:$APPLE_CERTIFICATE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::APPLE_CERTIFICATE could not be opened with APPLE_CERTIFICATE_PASSWORD. Re-export the Developer ID Application certificate as .p12 and update both secrets together."
            exit 1
          fi

          cert_summary="$(openssl pkcs12 -in "$cert_path" -nokeys -passin "pass:$APPLE_CERTIFICATE_PASSWORD" 2>/dev/null | openssl x509 -noout -subject 2>/dev/null || true)"
          if ! printf '%s' "$cert_summary" | grep -q "Developer ID Application"; then
            echo "::error::APPLE_CERTIFICATE is not a Developer ID Application certificate."
            exit 1
          fi

          if ! printf '%s' "$APPLE_API_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            echo "::error::APPLE_API_KEY_P8 must contain the full AuthKey_XXXXXXXXXX.p8 private key, including BEGIN/END PRIVATE KEY lines."
            exit 1
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" verify-signing.keychain >/dev/null
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" verify-signing.keychain >/dev/null
          security import "$cert_path" -k verify-signing.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" verify-signing.keychain >/dev/null 2>&1
          if ! security find-identity -v -p codesigning verify-signing.keychain | grep -Fq "$APPLE_SIGNING_IDENTITY"; then
            echo "::error::APPLE_SIGNING_IDENTITY was not found after importing APPLE_CERTIFICATE."
            exit 1
          fi
          security delete-keychain verify-signing.keychain >/dev/null

          echo "macOS signing and notarization secrets verified before installing dependencies."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        with:
          projectPath: .
          tauriScript: npm run tauri
          tagName: __VERSION__
          releaseName: "DockBricks __VERSION__"
          releaseBody: "See the assets below to download this version."
          releaseDraft: true
          prerelease: false
          args: ${{ env.RELEASE_ARGS }}
